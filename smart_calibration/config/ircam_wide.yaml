# calibration_node settings tuned for the ircam_wide camera and its 6x7 board.
# Copy this file per camera / board and select it with: params_file:=<path>
#
# Live parameters (gamma, stretch_*, detector_*) can also be changed while running, from the GUI
# or with `ros2 param set /calibration_node <name> <value>`; the rest is read at startup.
calibration_node:
  ros__parameters:
    # Board type (startup only): chessboard (plain, completely visible, size below) or
    # oversized_marker (radon checkerboard larger than the view, with three marker dots in an L
    # near its middle that has exactly one white marker cell; any visible part of 5x5+ corners).
    board_mode: chessboard
    # Chessboard: number of INNER corners (squares - 1) along each axis (chessboard mode only).
    board_cols: 6
    board_rows: 7
    # Side length of one square in metres. Placeholder: measure the printed board.
    square_size: 0.1

    # Preprocessing: contrast stretch between these intensity percentiles, then gamma.
    stretch_low_percentile: 0.5
    stretch_high_percentile: 99.5
    gamma: 0.5
    # S-shaped contrast curve after gamma (0: off); midpoint = grey level (0-1) it keeps.
    contrast_strength: 3.0
    contrast_midpoint: 0.8

    # findChessboardCornersSB flags. exhaustive + accuracy gave ~80-90 % detection with this
    # camera (accuracy also lowers the corner error, at ~4x the detection time).
    detector_normalize: false
    detector_exhaustive: true
    detector_accuracy: false

    # View selection: only keep detections while the board moves at most this many pixels per
    # second (mean corner movement since the previous detection), against motion blur.
    max_board_speed: 50.0
    # ... and only if no corner is misplaced: distance (in square sizes) of each corner from where
    # a quadratic surface through its neighbours (within 3 squares) puts it. Correct corners stay
    # below ~0.06 on synthetic views; any corner above the limit discards the whole frame.
    max_corner_residual: 0.1
    # Corners closer than this to the image border (or outside it) are not used (the detector
    # may predict or mismatch corners there); the rest of the frame is.
    border_margin_px: 10.0
    # ... and only if the board outline (four outermost corners) differs from every kept view by
    # at least this much: mean corner distance in board sizes (mean side length of the outline),
    # so the same movement counts the same near the camera and far from it.
    min_view_distance: 0.1

    # Background calibration from the kept views: first after min_calibration_views views, then
    # every calibrate_every_views new views. k3 stays 0 below free_k3_after_views views (with few
    # views it makes the distortion run wild where no corners are). The estimated uncertainty is
    # multiplied by uncertainty_scale (it comes out ~1.5-2.5x too small on synthetic data).
    min_calibration_views: 5
    calibrate_every_views: 3
    free_k3_after_views: 20
    uncertainty_scale: 2.0

    # Camera subscription: auto matches the camera publisher's reliability.
    image_qos: auto

    # Preview sent to the GUI.
    preview_max_width: 1280
    preview_jpeg_quality: 80
