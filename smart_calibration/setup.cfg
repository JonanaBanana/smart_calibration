[develop]
script_dir=$base/lib/smart_calibration
[install]
install_scripts=$base/lib/smart_calibration
[build_scripts]
# Installed executables get a `#!/usr/bin/env python3` shebang, so they run on the venv's Python
# when the venv is activated (see README.md). Only applies to builds without --symlink-install.
executable=/usr/bin/env python3
